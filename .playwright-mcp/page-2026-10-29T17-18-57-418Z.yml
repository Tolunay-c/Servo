          - generic [ref=f9e144]:
            - generic [ref=f9e145]:
              - heading "Starting point" [level=4] [ref=f9e146]
              - paragraph [ref=f9e147]: Measuring and adjusting each reference line individually at every recipe change was the longest stop on the line, and small offsets between layers accumulated at the merge point.
            - generic [ref=f9e148]:
              - heading "What was installed" [level=4] [ref=f9e149]
              - paragraph [ref=f9e150]: "A three-rail shuttle architecture: one servo axis carries 26 carriages to their recipe positions in sequence, each carriage locks on its rail, and once setup is complete every reference line remains visible at the same time."
          - figure "Site photograph · hygiene products and nonwoven" [ref=f9e151]:
            - img "Hygiene products and nonwoven application image 1" [ref=f9e152]
