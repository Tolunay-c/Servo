              - heading "Starting point" [level=4] [ref=f9e199]
              - paragraph [ref=f9e200]: The same product was set up differently across shifts, resulting in inconsistent output and increased material waste. There was no shared position reference across sizes.
            - generic [ref=f9e201]:
              - heading "What was installed" [level=4] [ref=f9e202]
              - paragraph [ref=f9e203]: Sixteen laser carriages move to the positions defined in the recipe. At a size change the operator simply selects the recipe, and every position is rebuilt within the same reference frame.
