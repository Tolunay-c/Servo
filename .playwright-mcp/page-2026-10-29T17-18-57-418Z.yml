            - heading "EDGE AND SYMMETRY REFERENCE ON A CURVED SURFACE" [level=3] [ref=f9e63]
            - paragraph [ref=f9e64]: The layup width of the reinforcement plies changed from product to product, and the edge and symmetry reference had to be rebuilt at every changeover.
