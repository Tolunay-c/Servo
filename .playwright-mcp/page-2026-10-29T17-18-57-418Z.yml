            - paragraph [ref=f9e126]: HYGIENE PRODUCTS AND NONWOVEN · MULTI-LAYER LINE
            - heading "TWENTY-SIX LASER LINES, ONE SERVO AXIS" [level=3] [ref=f9e127]
            - paragraph [ref=f9e128]: Many laser reference lines had to be visible simultaneously, and the product size changed several times a day.
          - generic [ref=f9e129]:
            - generic [ref=f9e130]:
              - generic [ref=f9e131]:
                - text: Shuttle
