  - banner [ref=f149e29]:
    - generic [ref=f149e30]:
      - generic [ref=f149e31]:
        - paragraph [ref=f149e32]: SERVOMOTION · SIMULTANEOUS MULTI-LASER POSITIONING
        - heading "Shuttle Precisor" [level=1] [ref=f149e33]:
          - text: Shuttle
          - emphasis [ref=f149e34]:
            - generic [ref=f149e35]: Precisor
        - generic [ref=f149e36]:
          - paragraph [ref=f149e37]: "The right solution for high-density industrial lines where several cutting lines must be positioned at the same time:"
          - list [ref=f149e38]:
            - listitem [ref=f149e39]: "One servo, unlimited lines: No motor, drive or cable per laser; system cost and cable complexity do not grow as the number of lines increases."
            - listitem [ref=f149e40]: "Recipe changeover in seconds: The shuttle picks up the locked carriages in turn and moves them to the new size; the line does not wait for minutes."
            - listitem [ref=f149e41]: "Stability after setup: Each carriage locks mechanically to the rail once positioned, so the lines stay where they were aligned after the shuttle withdraws."
        - generic [ref=f149e42]:
