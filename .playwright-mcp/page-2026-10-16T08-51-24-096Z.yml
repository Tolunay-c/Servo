    - generic [ref=f149e122]:
      - generic [ref=f149e123]:
        - generic [ref=f149e124]: Simultaneous Visibility
        - text: All cutting lines stay active throughout operation and are projected simultaneously along the line.
      - generic [ref=f149e125]:
        - generic [ref=f149e126]: Locked Position
        - text: Once a carriage is seated it locks to the rail; vibration or loss of power does not shift the line.
      - generic [ref=f149e127]:
        - generic [ref=f149e128]: Reserve Zone
        - text: Laser carriages not in active use wait in their own park zone at the end of the rail.
      - generic [ref=f149e129]:
        - generic [ref=f149e130]: Single-Axis Drive Architecture
        - text: No per-laser motor drive cost, cable complexity or maintenance load.
  - generic [ref=f149e132]:
    - generic [ref=f149e133]:
      - paragraph [ref=f149e135]: Architecture
      - heading "Three-Rail Shuttle Architecture" [level=2] [ref=f149e136]
      - paragraph [ref=f149e137]: "Power transmission, carriage guidance and motion drive sit in one rail assembly. One servo axis performs all movement instead of a motor, drive and cable per laser: fewer components and a simpler maintenance routine. The number of servo axes remains unchanged as laser carriages are added, helping limit system complexity as the application scales."
    - generic [ref=f149e138]:
      - generic [ref=f149e139]:
        - generic [ref=f149e140]: UPPER RAIL
        - heading "Power supply" [level=3] [ref=f149e141]
        - paragraph [ref=f149e142]: Lasers are powered continuously at any position along the rail, so moving cables and energy chains are not required.
      - generic [ref=f149e143]:
        - generic [ref=f149e144]: MIDDLE RAIL
        - heading "Laser carriages" [level=3] [ref=f149e145]
        - paragraph [ref=f149e146]: Each laser travels in its own carriage. When it reaches its position it locks on the rail and stays there independently of the shuttle.
      - generic [ref=f149e147]:
        - generic [ref=f149e148]: LOWER RAIL
        - heading "Servo shuttle" [level=3] [ref=f149e149]
        - paragraph [ref=f149e150]: The only moving axis of the system. It carries the carriages to their recipe positions in sequence and withdraws when finished.
    - heading "Setup cycle" [level=3] [ref=f149e151]
    - generic [ref=f149e152]:
      - generic [ref=f149e153]:
        - generic [ref=f149e154]: "01"
        - heading "Recipe" [level=4] [ref=f149e155]
        - paragraph [ref=f149e156]: Cut dimensions are entered at the panel, and the system calculates the target position for each laser.
      - generic [ref=f149e157]:
        - generic [ref=f149e158]: "02"
        - heading "Approach" [level=4] [ref=f149e159]
        - paragraph [ref=f149e160]: The shuttle positions itself under the next laser carriage on the lower rail.
      - generic [ref=f149e161]:
        - generic [ref=f149e162]: "03"
        - heading "Transport" [level=4] [ref=f149e163]
        - paragraph [ref=f149e164]: The carriage is moved to its recipe position with the laser on, so the reference line can be followed as it travels.
      - generic [ref=f149e165]:
        - generic [ref=f149e166]: "04"
        - heading "Release" [level=4] [ref=f149e167]
        - paragraph [ref=f149e168]: The carriage is fixed in position and becomes independent of the shuttle.
      - generic [ref=f149e169]:
        - generic [ref=f149e170]: "05"
        - heading "Completion" [level=4] [ref=f149e171]
        - paragraph [ref=f149e172]: The shuttle moves to the next carriage; once all lines are set it withdraws to the home position.
    - heading "What This Architecture Delivers" [level=3] [ref=f149e173]
    - generic [ref=f149e174]:
      - generic [ref=f149e175]:
        - heading "Fewer Parts" [level=4] [ref=f149e176]
        - paragraph [ref=f149e177]: No servo motor, drive or cable per laser. As the system grows only the number of carriages increases, not the parts list.
      - generic [ref=f149e178]:
        - heading "Simple Maintenance" [level=4] [ref=f149e179]
        - paragraph [ref=f149e180]: Periodic maintenance is concentrated on the single servo axis. The carriages have no moving electrical connections.
      - generic [ref=f149e181]:
        - heading "Easy Access" [level=4] [ref=f149e182]
        - paragraph [ref=f149e183]: Carriages are added, removed and lasers replaced from the rail; the housing does not have to be removed from the line.
      - generic [ref=f149e184]:
        - heading "Scalable Investment" [level=4] [ref=f149e185]
        - paragraph [ref=f149e186]: When the number of cutting lines grows, the drive and control infrastructure stays the same; only carriages are added.
      - generic [ref=f149e187]:
        - heading "Low Operating Cost" [level=4] [ref=f149e188]
        - paragraph [ref=f149e189]: Few moving components mean few spare parts and short downtime.
  - generic [ref=f149e191]:
    - generic [ref=f149e192]:
      - paragraph [ref=f149e194]: Motion video · Setup cycle
      - heading "Recipe changeover cycle" [level=2] [ref=f149e195]
      - paragraph [ref=f149e196]: An uninterrupted recording of one servo axis carrying every laser carriage to its recipe position in sequence. The shuttle travels at 800 mm/s when empty and 500 mm/s when carrying a carriage; at the end of the cycle the lines settle to ±1.00 mm projection accuracy and the shuttle withdraws to its home position. The recording is an accelerated simulation of a 2,400 mm travel range with 20 laser carriages.
    - generic [ref=f149e197]: Your browser does not support the video tag. .
    - paragraph [ref=f149e199]: "15 s · 1280×866 · MP4 / H.264 · Scenario: 2,400 mm travel range · 20 laser carriages · 123.2 mm line spacing · 20 active / 0 reserve · required rail 2,500 mm"
