      - paragraph [ref=f149e204]: Configurator
      - heading "Configure the system yourself" [level=2] [ref=f149e205]
      - paragraph [ref=f149e206]: Enter the required travel range of your line and calculate the number of projected laser lines or the spacing straight away. Lasers not used by the recipe collect in the reserve zone at the end of the rail, and the tool reports carriage clearance checks, safety margins and the total rail length required in real time.
