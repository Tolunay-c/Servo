          - paragraph [ref=f16e165]: Tanımlanan kenar ve eksen konumları, çalışma yüzeyine lazer çizgileri olarak yansıtılır. Operatörün malzeme veya parçayı ortak bir referansa göre yerleştirmesi sağlanarak manuel ölçü aktarımı ihtiyacı azaltılır.
