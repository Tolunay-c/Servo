  - generic [ref=f148e65]:
    - generic [ref=f148e66]:
      - paragraph [ref=f148e68]: Application areas
      - heading "A laser reference for placement and alignment" [level=2] [ref=f148e69]
      - paragraph [ref=f148e70]:
        - text: Core
        - generic [ref=f148e71]: Precisor
        - text: projects the positions held in the recipe onto the working surface as laser lines. By making material edges, the centre axis and setup points visible, it gives the operator an alignment reference across different production processes.
    - generic [ref=f148e72]:
      - article [ref=f148e73]:
        - text: 01 · MATERIAL PLACEMENT
        - heading "Layer and edge alignment" [level=3] [ref=f148e74]
        - paragraph [ref=f148e75]: Shows the target edge positions as laser lines while material and parts are placed. The operator works to those references. The projection layout is set from the working surface and the geometry of the application.
      - article [ref=f148e76]:
        - text: 02 · MACHINE SETUP
        - heading "Positioning from the recipe" [level=3] [ref=f148e77]
        - paragraph [ref=f148e78]: When the product size changes, the lasers move to the new target positions. While guides, stops or cutting elements are set, the figure from the recipe is shown directly in the working area.
      - article [ref=f148e79]:
        - text: 03 · CENTRE AND SYMMETRY
        - heading "Axis and width reference" [level=3] [ref=f148e80]
        - paragraph [ref=f148e81]: A fixed laser marks the centre axis while the moving lasers mark the target positions on either side. This gives centring, width setting and symmetrical placement one shared reference.
  - generic [ref=f148e83]:
    - generic [ref=f148e84]:
      - paragraph [ref=f148e86]: Contribution to production
      - heading "Defined positions, repeatable setup" [level=2] [ref=f148e87]
      - paragraph [ref=f148e88]: Showing the recipe dimensions directly in the working area lets material placement and machine setup run from the same references.
    - generic [ref=f148e89]:
      - article [ref=f148e90]:
        - heading "Brings the figure to the floor" [level=3] [ref=f148e91]
        - paragraph [ref=f148e92]: Laser lines make the target positions visible on the surface. This helps reduce manual measurement transfer and keeps the reference in view during placement.
      - article [ref=f148e93]:
        - heading "Eases the product changeover" [level=3] [ref=f148e94]
        - paragraph [ref=f148e95]: The positions belonging to a new recipe are shown by servo-controlled motion. How much setup time this saves depends on the layout of the application and on what the operator does.
      - article [ref=f148e96]:
        - heading "Standardises the setup method" [level=3] [ref=f148e97]
        - paragraph [ref=f148e98]: References defined for a product can be reused, so different operators place and align to the same targets.
  - generic [ref=f148e100]:
    - generic [ref=f148e101]:
      - paragraph [ref=f148e103]: Working principle
      - heading "From recipe to automatic laser positioning" [level=2] [ref=f148e104]
      - paragraph [ref=f148e105]: PLC-controlled servo axes carry the laser modules to the defined targets. The projected laser reference lines guide material placement or machine setting, while the operator carries out the physical alignment. The position is not a one-off setting made at installation — it is recipe data.
    - heading "Working cycle" [level=3] [ref=f148e106]
    - generic [ref=f148e107]:
      - generic [ref=f148e108]:
        - generic [ref=f148e109]: "01"
        - heading "Recipe" [level=4] [ref=f148e110]
        - paragraph [ref=f148e111]: Position and width values for the product are entered at the control interface.
      - generic [ref=f148e112]:
        - generic [ref=f148e113]: "02"
        - heading "Targets transferred" [level=4] [ref=f148e114]
        - paragraph [ref=f148e115]: The PLC sends the position commands to the servo axes for the selected movement configuration.
      - generic [ref=f148e116]:
        - generic [ref=f148e117]: "03"
        - heading "Lasers move" [level=4] [ref=f148e118]
        - paragraph [ref=f148e119]: The lines travel to their target positions under closed-loop control and stop there.
      - generic [ref=f148e120]:
        - generic [ref=f148e121]: "04"
        - heading "Production" [level=4] [ref=f148e122]
        - paragraph [ref=f148e123]: The references stay in place, and the same recipe returns the lines to the same positions on each run.
    - heading "What This Architecture Delivers" [level=3] [ref=f148e124]
    - generic [ref=f148e125]:
      - generic [ref=f148e126]:
        - heading "Protected housing" [level=4] [ref=f148e127]
        - paragraph [ref=f148e128]: The laser modules, servo axes and cabling sit inside a closed housing. Dust, fibre and moisture from the line cannot reach the moving parts; cleaning is limited to the outer surface and the laser window.
      - generic [ref=f148e129]:
        - heading "Permanent centre reference" [level=4] [ref=f148e130]
        - paragraph [ref=f148e131]: The fixed laser in the centre never moves. Symmetrical recipes are set up around this line, so the machine centre can be verified at any time without measuring.
      - generic [ref=f148e132]:
        - heading "Symmetrical motion" [level=4] [ref=f148e133]
        - paragraph [ref=f148e134]: In dual-channel and symmetrical configurations two lasers move at the same time; the same number of steps shows twice as many line positions.
      - generic [ref=f148e135]:
        - heading "Compact mounting" [level=4] [ref=f148e136]
        - paragraph [ref=f148e137]: The system is mounted over the line as a single housing. No rail along the machine, carriage park zone or extra chassis is required.
      - generic [ref=f148e138]:
        - heading "Proportionate investment" [level=4] [ref=f148e139]
        - paragraph [ref=f148e140]: On lines with few reference lines, one or two axes are enough. Cost follows the number of lines actually needed, not the width of the machine.
  - generic [ref=f148e142]:
