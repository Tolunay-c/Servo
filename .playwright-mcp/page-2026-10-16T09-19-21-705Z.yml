  - main [ref=f1e29]:
    - generic [ref=f1e31]:
      - generic [ref=f1e32]:
        - paragraph [ref=f1e33]: SERVO-CONTROLLED LASER POSITIONING
        - heading [level=1] [ref=f1e34]:
          - text: ACCURATE POSITIONING.
          - emphasis [ref=f1e35]: FASTER CHANGEOVERS.
        - paragraph [ref=f1e36]: ServoMotion drives laser lines to the target positions held in your product recipe. The reference position is no longer a one-off setting made at installation — it is recipe data. When the product changes, the targets change with it and the lines return to the same place, changeover after changeover.
        - generic [ref=f1e37]:
          - link "COMPARE THE SYSTEMS" [ref=f1e38] [cursor=pointer]:
            - /url: "#systems"
          - link "REQUEST A QUOTE" [ref=f1e39] [cursor=pointer]:
            - /url: http://localhost/servo/en/contact/
      - img "Core Precisor" [ref=f1e41]
    - generic [ref=f1e43]:
      - generic [ref=f1e44]:
        - paragraph [ref=f1e45]: TWO ARCHITECTURES
        - heading "ONE REFERENCE PRINCIPLE TWO WAYS TO MOVE" [level=2] [ref=f1e46]
        - paragraph [ref=f1e47]: Both systems project the alignment reference under PLC and servo control. What separates them is how many lines have to stay visible at the same time.
      - generic [ref=f1e48]:
        - generic [ref=f1e49]:
          - paragraph [ref=f1e50]: UP TO SIX LINES · SEQUENTIAL
          - heading "CORE PRECISOR" [level=3] [ref=f1e51]
          - paragraph [ref=f1e52]: A servo-driven laser alignment system in an enclosed housing. Laser lines move to the positions held in the recipe, and six movement configurations cover independent and symmetrical alignment needs.
          - link "View Core Precisor →" [ref=f1e53] [cursor=pointer]:
            - /url: http://localhost/servo/en/core-precisor/
            - text: View Core
            - generic [ref=f1e54]: Precisor
            - text: →
        - generic [ref=f1e55]:
          - paragraph [ref=f1e56]: MANY LINES · SIMULTANEOUS
          - heading "SHUTTLE PRECISOR" [level=3] [ref=f1e57]
          - paragraph [ref=f1e58]: A three-rail shuttle architecture. A single servo axis carries each laser carriage to its recipe position in turn; every carriage then locks mechanically, so all lines stay visible throughout production.
          - link "View Shuttle Precisor →" [ref=f1e59] [cursor=pointer]:
            - /url: http://localhost/servo/en/shuttle-precisor/
            - text: View Shuttle
            - generic [ref=f1e60]: Precisor
            - text: →
    - generic [ref=f1e62]:
      - generic [ref=f1e63]:
        - paragraph [ref=f1e64]: PROCESS AND APPLICATION GAINS
        - heading "ACCURACY AND REPEATABILITY IN ALIGNMENT WORK" [level=2] [ref=f1e65]
      - generic [ref=f1e66]:
        - article [ref=f1e67]:
          - generic [ref=f1e68]: 01 / MATERIAL PLACEMENT
          - heading "EDGE AND AXIS REFERENCE" [level=3] [ref=f1e69]
          - paragraph [ref=f1e70]: The defined edge and axis positions are projected onto the working surface as laser lines. The operator places the material or part against a shared reference, which reduces the need to transfer measurements by hand.
        - article [ref=f1e71]:
          - generic [ref=f1e72]: 02 / MACHINE SETUP
          - heading "A CONTROLLED SETUP PROCESS" [level=3] [ref=f1e73]
          - paragraph [ref=f1e74]: The target positions of guides, stops and processing elements are shown by the laser references. Being able to follow the setup points directly in the working area simplifies commissioning and cuts repeated measurement steps.
        - article [ref=f1e75]:
          - generic [ref=f1e76]: 03 / PRODUCT CHANGEOVER
          - heading "REPEATABILITY FROM THE RECIPE" [level=3] [ref=f1e77]
          - paragraph [ref=f1e78]: Position data for each product is held in the recipe and reapplied under PLC control at the next changeover. Returning to the same reference layout supports a standard setup method and shortens preparation between products.
    - generic [ref=f1e80]:
      - generic [ref=f1e81]:
        - paragraph [ref=f1e82]: CATEGORY DIFFERENCE
        - heading "NOT A FIXED SETTING. POSITIONING BY RECIPE." [level=2] [ref=f1e83]
      - generic [ref=f1e84]:
        - generic [ref=f1e85]:
          - generic [ref=f1e86]: Traditional fixed reference
          - paragraph [ref=f1e87]: The laser is set once at commissioning. Every recipe change then means re-adjusting the line by hand, so the result depends on who does it, how it is measured and how much time is available.
        - generic [ref=f1e88]:
          - generic [ref=f1e89]: Servo-controlled reference
          - paragraph [ref=f1e90]: Dimensions are entered at the panel and the system drives to the target positions itself. Call up the same recipe and the lines return to the same place — changeover becomes a machine task rather than an operator task, improving changeover repeatability.
