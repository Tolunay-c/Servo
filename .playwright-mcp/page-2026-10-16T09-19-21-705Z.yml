            - cell "Carriage and laser replacement along the rail" [ref=f1e153]
      - paragraph [ref=f1e154]: Final performance and connectivity are assessed together with motion load, working distance and mounting conditions. The lasers provide an alignment reference; adjustment of material and machine elements remains with the operator.
    - generic [ref=f1e156]:
      - generic [ref=f1e157]:
        - paragraph [ref=f1e158]: INDUSTRIAL APPLICATIONS
        - heading "DIFFERENT PROCESSES ONE ALIGNMENT APPROACH" [level=2] [ref=f1e159]
      - generic [ref=f1e160]:
        - article [ref=f1e161]:
          - heading "RUBBER AND COMPOSITE" [level=3] [ref=f1e174]
          - paragraph [ref=f1e175]: The lay-up width of the reinforcement plies changes from product to product, so the edge and symmetry reference has to be re-established at every changeover. The reference lines follow the geometry of the application surface.
          - paragraph [ref=f1e176]:
            - emphasis [ref=f1e177]: Decisive factors
            - text: Ply width, symmetry axis, geometry of the application surface and working distance.
          - paragraph [ref=f1e178]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f1e179]:
              - text: Core
              - generic [ref=f1e180]: Precisor
            - text: · K4 dual channel (1 fixed + 2 moving) · 1,600 mm travel
          - link "See the application →" [ref=f1e181] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/rubber/
        - article [ref=f1e182]:
          - heading "HYGIENE PRODUCTS AND NONWOVEN" [level=3] [ref=f1e216]
          - paragraph [ref=f1e217]: Every layer in a multi-ply structure needs a consistent edge and axis reference, while the product size changes often. When the size changes, the alignment positions are rebuilt from the recipe.
          - paragraph [ref=f1e218]:
            - emphasis [ref=f1e219]: Decisive factors
            - text: Number of layers, working width, number of simultaneous reference lines and the optical behaviour of the nonwoven surface.
          - paragraph [ref=f1e220]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f1e221]:
              - text: Shuttle
              - generic [ref=f1e222]: Precisor
            - text: · 26 lasers · 2,300 mm travel
          - link "See the application →" [ref=f1e223] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/nonwoven/
        - article [ref=f1e224]:
          - heading "PACKAGING AND PAPER" [level=3] [ref=f1e247]
          - paragraph [ref=f1e248]: Changing between formats holds the line while guides and processing elements are reset. A shared position reference keeps the same setup discipline across formats.
          - paragraph [ref=f1e249]:
            - emphasis [ref=f1e250]: Decisive factors
            - text: Format variety, recipe change frequency and the number of reference lines that must be visible at the same time.
          - paragraph [ref=f1e251]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f1e252]:
              - text: Shuttle
              - generic [ref=f1e253]: Precisor
            - text: · 16 lasers · 1,800 mm travel
          - link "See the application →" [ref=f1e254] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/packaging/
        - article [ref=f1e255]:
          - heading "FILM AND FOIL" [level=3] [ref=f1e265]
          - paragraph [ref=f1e266]: The job usually starts with where the two edges sit. Reel width and slit width change from recipe to recipe, so the edge position has to be re-established at every changeover.
          - paragraph [ref=f1e267]:
            - emphasis [ref=f1e268]: Decisive factors
            - text: Surface optics, distance between the edges, laser colour and working distance.
          - paragraph [ref=f1e269]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f1e270]:
              - text: Core
              - generic [ref=f1e271]: Precisor
            - text: · K3 single channel + fixed (1 moving + 2 fixed references) · 2,000 mm travel
          - link "See the application →" [ref=f1e272] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/film-foil/
        - article [ref=f1e273]:
          - img [aria-hidden] [ref=f1e275]:
            - generic [ref=f1e285]: FIXED CENTRE
          - heading "TEXTILES AND TECHNICAL FABRICS" [level=3] [ref=f1e286]
          - paragraph [ref=f1e287]: Symmetry matters as much as edge position. Once the centre axis is lost the product comes out off-centre even when the edges are correct, so the centre reference has to stay visible throughout production.
          - paragraph [ref=f1e288]:
            - emphasis [ref=f1e289]: Decisive factors
            - text: Lay-up width, centre axis, ply arrangement and mounting height.
          - paragraph [ref=f1e290]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f1e291]:
              - text: Core
              - generic [ref=f1e292]: Precisor
            - text: · K4 dual channel (2 moving + 1 fixed centre) · 2,400 mm travel
          - link "See the application →" [ref=f1e293] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/textiles/
        - article [ref=f1e294]:
          - heading "LABELS AND ADHESIVE TAPE" [level=3] [ref=f1e340]
          - paragraph [ref=f1e341]: In narrow-width slitting a single recipe means dozens of cut positions. Measuring and setting them one by one can become the longest stoppage on the line.
          - paragraph [ref=f1e342]:
            - emphasis [ref=f1e343]: Decisive factors
            - text: Line spacing, number of simultaneous reference lines and mechanical layout.
          - paragraph [ref=f1e344]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f1e345]:
              - text: Shuttle
              - generic [ref=f1e346]: Precisor
            - text: · 20 lasers · 1,800 mm travel
          - link "See the application →" [ref=f1e347] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/labels/
      - paragraph [ref=f1e348]:
        - text: "Real installations of this approach across six segments:"
        - link "see the success stories →" [ref=f1e349] [cursor=pointer]:
          - /url: http://localhost/servo/en/success-stories/
    - generic [ref=f1e351]:
      - generic [ref=f1e352]:
        - paragraph [ref=f1e353]: SERVOMOTION / OEM LAZER
        - heading "ENGINEERING FROM DESIGN THROUGH COMMISSIONING" [level=2] [ref=f1e354]
      - generic [ref=f1e355]:
        - paragraph [ref=f1e356]: OEM Lazer has been developing industrial laser applications since 2014. In ServoMotion systems we bring mechanical design, laser placement and servo motion control together with PLC automation. The working area, the mounting conditions and the process requirements are assessed together, and the system structure is set from that. Our engineering work runs through to installation, commissioning and integration into the production line.
        - link "See how we engineer →" [ref=f1e357] [cursor=pointer]:
          - /url: http://localhost/servo/en/company/
        - link "Service and commissioning →" [ref=f1e358] [cursor=pointer]:
          - /url: http://localhost/servo/en/service/
        - link "Request data sheets →" [ref=f1e359] [cursor=pointer]:
          - /url: http://localhost/servo/en/documents/
    - generic [ref=f1e361]:
      - generic [ref=f1e362]:
        - heading "LET'S DEFINE THE RIGHT SYSTEM FOR YOUR LINE" [level=2] [ref=f1e363]
        - paragraph [ref=f1e364]: Tell us the required travel range, how many lines you need at the same time and your mounting structure, and we will review the application with you.
      - link "BUILD AN APPLICATION SUMMARY" [ref=f1e365] [cursor=pointer]:
        - /url: http://localhost/servo/en/contact/
