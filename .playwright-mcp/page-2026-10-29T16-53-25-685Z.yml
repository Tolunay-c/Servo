          - row [ref=f4e176]:
            - cell "Common infrastructure" [ref=f4e177]
            - cell "Industrial PLC and servo drive control Integration into line automation via a standard fieldbus Touchscreen operator panel Industrial line laser modules" [ref=f4e178]:
