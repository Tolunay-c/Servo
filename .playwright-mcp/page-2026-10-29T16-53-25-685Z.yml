      - paragraph [ref=f4e202]: Final performance and connectivity are assessed together with motion load, working distance and mounting conditions. The lasers provide an alignment reference; adjustment of material and machine elements remains with the operator.
    - generic [ref=f4e204]:
      - generic [ref=f4e205]:
        - paragraph [ref=f4e206]: INDUSTRIAL APPLICATIONS
        - heading "DIFFERENT PROCESSES ONE ALIGNMENT APPROACH" [level=2] [ref=f4e207]
      - generic [ref=f4e208]:
        - article [ref=f4e209]:
          - heading "RUBBER AND COMPOSITE" [level=3] [ref=f4e222]
          - paragraph [ref=f4e223]: The lay-up width of the reinforcement plies changes from product to product, so the edge and symmetry reference has to be re-established at every changeover. The reference lines follow the geometry of the application surface.
          - paragraph [ref=f4e224]:
            - emphasis [ref=f4e225]: Decisive factors
            - text: Ply width, symmetry axis, geometry of the application surface and working distance.
          - paragraph [ref=f4e226]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f4e227]:
              - text: Core
              - generic [ref=f4e228]: Precisor
            - text: · K4 dual channel (1 fixed + 2 moving) · 1,600 mm travel
          - link "See the application →" [ref=f4e229] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/rubber/
        - article [ref=f4e230]:
          - heading "HYGIENE PRODUCTS AND NONWOVEN" [level=3] [ref=f4e264]
          - paragraph [ref=f4e265]: Every layer in a multi-ply structure needs a consistent edge and axis reference, while the product size changes often. When the size changes, the alignment positions are rebuilt from the recipe.
          - paragraph [ref=f4e266]:
            - emphasis [ref=f4e267]: Decisive factors
            - text: Number of layers, working width, number of simultaneous reference lines and the optical behaviour of the nonwoven surface.
          - paragraph [ref=f4e268]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f4e269]:
              - text: Shuttle
              - generic [ref=f4e270]: Precisor
            - text: · 26 lasers · 2,300 mm travel
          - link "See the application →" [ref=f4e271] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/nonwoven/
        - article [ref=f4e272]:
          - heading "PACKAGING AND PAPER" [level=3] [ref=f4e295]
          - paragraph [ref=f4e296]: Changing between formats holds the line while guides and processing elements are reset. A shared position reference keeps the same setup discipline across formats.
          - paragraph [ref=f4e297]:
            - emphasis [ref=f4e298]: Decisive factors
            - text: Format variety, recipe change frequency and the number of reference lines that must be visible at the same time.
          - paragraph [ref=f4e299]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f4e300]:
              - text: Shuttle
              - generic [ref=f4e301]: Precisor
            - text: · 16 lasers · 1,800 mm travel
          - link "See the application →" [ref=f4e302] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/packaging/
        - article [ref=f4e303]:
          - heading "FILM AND FOIL" [level=3] [ref=f4e313]
          - paragraph [ref=f4e314]: The job usually starts with where the two edges sit. Reel width and slit width change from recipe to recipe, so the edge position has to be re-established at every changeover.
          - paragraph [ref=f4e315]:
            - emphasis [ref=f4e316]: Decisive factors
            - text: Surface optics, distance between the edges, laser colour and working distance.
          - paragraph [ref=f4e317]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f4e318]:
              - text: Core
              - generic [ref=f4e319]: Precisor
            - text: · K3 single channel + fixed (1 moving + 2 fixed references) · 2,000 mm travel
          - link "See the application →" [ref=f4e320] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/film-foil/
        - article [ref=f4e321]:
          - img [aria-hidden] [ref=f4e323]:
            - generic [ref=f4e333]: FIXED CENTRE
          - heading "TEXTILES AND TECHNICAL FABRICS" [level=3] [ref=f4e334]
          - paragraph [ref=f4e335]: Symmetry matters as much as edge position. Once the centre axis is lost the product comes out off-centre even when the edges are correct, so the centre reference has to stay visible throughout production.
          - paragraph [ref=f4e336]:
            - emphasis [ref=f4e337]: Decisive factors
            - text: Lay-up width, centre axis, ply arrangement and mounting height.
          - paragraph [ref=f4e338]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f4e339]:
              - text: Core
              - generic [ref=f4e340]: Precisor
            - text: · K4 dual channel (2 moving + 1 fixed centre) · 2,400 mm travel
          - link "See the application →" [ref=f4e341] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/textiles/
        - article [ref=f4e342]:
          - heading "LABELS AND ADHESIVE TAPE" [level=3] [ref=f4e388]
          - paragraph [ref=f4e389]: In narrow-width slitting a single recipe means dozens of cut positions. Measuring and setting them one by one can become the longest stoppage on the line.
          - paragraph [ref=f4e390]:
            - emphasis [ref=f4e391]: Decisive factors
            - text: Line spacing, number of simultaneous reference lines and mechanical layout.
          - paragraph [ref=f4e392]:
            - text: EXAMPLE INSTALLATION
            - generic [ref=f4e393]:
              - text: Shuttle
              - generic [ref=f4e394]: Precisor
            - text: · 20 lasers · 1,800 mm travel
          - link "See the application →" [ref=f4e395] [cursor=pointer]:
            - /url: http://localhost/servo/en/application/labels/
      - paragraph [ref=f4e396]:
        - text: "Real installations of this approach across six segments:"
        - link "see the success stories →" [ref=f4e397] [cursor=pointer]:
          - /url: http://localhost/servo/en/success-stories/
    - generic [ref=f4e399]:
      - generic [ref=f4e400]:
        - paragraph [ref=f4e401]: SERVOMOTION / OEM LAZER
        - heading "ENGINEERING FROM DESIGN THROUGH COMMISSIONING" [level=2] [ref=f4e402]
      - generic [ref=f4e403]:
        - paragraph [ref=f4e404]: OEM Lazer has been developing industrial laser applications since 2014. In ServoMotion systems we bring mechanical design, laser placement and servo motion control together with PLC automation. The working area, the mounting conditions and the process requirements are assessed together, and the system structure is set from that. Our engineering work runs through to installation, commissioning and integration into the production line.
        - link "See how we engineer →" [ref=f4e405] [cursor=pointer]:
          - /url: http://localhost/servo/en/company/
        - link "Service and commissioning →" [ref=f4e406] [cursor=pointer]:
          - /url: http://localhost/servo/en/service/
        - link "Request data sheets →" [ref=f4e407] [cursor=pointer]:
          - /url: http://localhost/servo/en/documents/
    - generic [ref=f4e409]:
      - generic [ref=f4e410]:
        - heading "LET'S DEFINE THE RIGHT SYSTEM FOR YOUR LINE" [level=2] [ref=f4e411]
        - paragraph [ref=f4e412]: Tell us the required travel range, how many lines you need at the same time and your mounting structure, and we will review the application with you.
      - link "BUILD AN APPLICATION SUMMARY" [ref=f4e413] [cursor=pointer]:
