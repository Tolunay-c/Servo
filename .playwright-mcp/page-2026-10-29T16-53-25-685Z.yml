    - generic [ref=f4e69]:
      - generic [ref=f4e70]:
        - paragraph [ref=f4e71]: TWO ARCHITECTURES
        - heading "ONE REFERENCE PRINCIPLE TWO WAYS TO MOVE" [level=2] [ref=f4e72]
        - paragraph [ref=f4e73]: Both systems project the alignment reference under PLC and servo control. What separates them is how many lines have to stay visible at the same time.
      - generic [ref=f4e74]:
        - generic [ref=f4e75]:
          - paragraph [ref=f4e76]: UP TO SIX LINES · SEQUENTIAL
          - heading "CORE PRECISOR" [level=3] [ref=f4e77]
          - paragraph [ref=f4e78]: A servo-driven laser alignment system in an enclosed housing. Laser lines move to the positions held in the recipe, and six movement configurations cover independent and symmetrical alignment needs.
          - link "View Core Precisor →" [ref=f4e79] [cursor=pointer]:
            - /url: http://localhost/servo/en/core-precisor/
            - text: View Core
            - generic [ref=f4e80]: Precisor
            - text: →
        - generic [ref=f4e81]:
          - paragraph [ref=f4e82]: MANY LINES · SIMULTANEOUS
          - heading "SHUTTLE PRECISOR" [level=3] [ref=f4e83]
          - paragraph [ref=f4e84]: A three-rail shuttle architecture. A single servo axis carries each laser carriage to its recipe position in turn; every carriage then locks mechanically, so all lines stay visible throughout production.
          - link "View Shuttle Precisor →" [ref=f4e85] [cursor=pointer]:
            - /url: http://localhost/servo/en/shuttle-precisor/
            - text: View Shuttle
            - generic [ref=f4e86]: Precisor
            - text: →
    - generic [ref=f4e88]:
      - generic [ref=f4e89]:
        - paragraph [ref=f4e90]: PROCESS AND APPLICATION GAINS
        - heading "ACCURACY AND REPEATABILITY IN ALIGNMENT WORK" [level=2] [ref=f4e91]
      - generic [ref=f4e92]:
        - article [ref=f4e93]:
          - generic [ref=f4e94]: 01 / MATERIAL PLACEMENT
          - heading "EDGE AND AXIS REFERENCE" [level=3] [ref=f4e95]
          - paragraph [ref=f4e96]: The defined edge and axis positions are projected onto the working surface as laser lines. The operator places the material or part against a shared reference, which reduces the need to transfer measurements by hand.
        - article [ref=f4e97]:
          - generic [ref=f4e98]: 02 / MACHINE SETUP
          - heading "A CONTROLLED SETUP PROCESS" [level=3] [ref=f4e99]
          - paragraph [ref=f4e100]: The target positions of guides, stops and processing elements are shown by the laser references. Being able to follow the setup points directly in the working area simplifies commissioning and cuts repeated measurement steps.
        - article [ref=f4e101]:
          - generic [ref=f4e102]: 03 / PRODUCT CHANGEOVER
          - heading "REPEATABILITY FROM THE RECIPE" [level=3] [ref=f4e103]
          - paragraph [ref=f4e104]: Position data for each product is held in the recipe and reapplied under PLC control at the next changeover. Returning to the same reference layout supports a standard setup method and shortens preparation between products.
    - generic [ref=f4e106]:
      - generic [ref=f4e107]:
        - paragraph [ref=f4e108]: CATEGORY DIFFERENCE
        - heading "NOT A FIXED SETTING. POSITIONING BY RECIPE." [level=2] [ref=f4e109]
      - generic [ref=f4e110]:
        - generic [ref=f4e111]:
          - generic [ref=f4e112]: Traditional fixed reference
          - paragraph [ref=f4e113]: The laser is set once at commissioning. Every recipe change then means re-adjusting the line by hand, so the result depends on who does it, how it is measured and how much time is available.
        - generic [ref=f4e114]:
          - generic [ref=f4e115]: Servo-controlled reference
          - paragraph [ref=f4e116]: Dimensions are entered at the panel and the system drives to the target positions itself. Call up the same recipe and the lines return to the same place — changeover becomes a machine task rather than an operator task, improving changeover repeatability.
