        - heading "DO THESE SOUND FAMILIAR?" [level=2] [ref=f14e61]
      - generic [ref=f14e62]:
        - generic [ref=f14e63]:
          - generic [ref=f14e64]: Re-alignment on every product
          - paragraph [ref=f14e65]: When the layup width changes, the edge and symmetry reference is rebuilt from scratch, making setup the longest item in the changeover.
        - generic [ref=f14e66]:
          - generic [ref=f14e67]: Judgement by eye on curved surfaces
          - paragraph [ref=f14e68]: On a cylindrical or curved surface, centring the ply depends on the operator’s viewing angle. The same product is set up differently across shifts, resulting in inconsistent output.
        - generic [ref=f14e69]:
          - generic [ref=f14e70]: The error shows up downstream
          - paragraph [ref=f14e71]: Ply misalignment goes unnoticed during layup, and by the time it appears at the next stage, correcting it is expensive.
        - generic [ref=f14e72]:
          - generic [ref=f14e73]: The reference drifts mechanically
          - paragraph [ref=f14e74]: Fixed guides and templates shift with vibration and contact, and need periodic readjustment.
    - generic [ref=f14e76]:
      - generic [ref=f14e77]:
        - paragraph [ref=f14e78]: WHAT WE MEASURE ON SITE
        - heading "PARAMETERS THAT DEFINE THE SYSTEM" [level=2] [ref=f14e79]
        - paragraph [ref=f14e80]: The parameters below drive the design decisions in this segment. We measure these values on your line and base the quotation on that data.
      - table [ref=f14e81]:
        - rowgroup [ref=f14e82]:
          - row [ref=f14e83]:
            - rowheader "Layup width range" [ref=f14e84]
            - cell "The difference between the narrowest and widest product determines the housing length and the travel range." [ref=f14e85]
          - row [ref=f14e86]:
            - rowheader "Symmetry axis" [ref=f14e87]
            - cell "Whether the centre reference must remain visible continuously determines the channel configuration." [ref=f14e88]
          - row [ref=f14e89]:
            - rowheader "Surface geometry" [ref=f14e90]
            - cell "Flat, curved or cylindrical geometry affects the projection angle and the mounting height." [ref=f14e91]
          - row [ref=f14e92]:
            - rowheader "Working distance" [ref=f14e93]
            - cell "The vertical distance between the laser and the surface determines line width and angular tolerance." [ref=f14e94]
          - row [ref=f14e95]:
            - rowheader "Support structure" [ref=f14e96]
            - cell "An existing frame or a new traverse; rigidity translates directly into accuracy." [ref=f14e97]
          - row [ref=f14e98]:
            - rowheader "Vibration and environment" [ref=f14e99]
            - cell "Line vibration, surface colour and overhead lighting all influence the choice of laser colour." [ref=f14e100]
