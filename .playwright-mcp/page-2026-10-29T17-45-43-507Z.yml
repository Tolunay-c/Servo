      - generic [ref=f14e106]:
        - generic [ref=f14e107]:
          - paragraph [ref=f14e108]: MOST APPLICATIONS
          - heading "CORE PRECISOR" [level=3] [ref=f14e109]
          - paragraph [ref=f14e110]: In reinforcement layup, the number of simultaneous reference lines is usually limited. An enclosed industrial profile drives to the target positions under servo control, and where symmetry is required, a dual-channel configuration keeps the centre reference continuously visible.
          - link "Explore Core Precisor →" [ref=f14e111] [cursor=pointer]:
            - /url: http://localhost/servo/en/core-precisor/
            - text: Explore Core
            - generic [ref=f14e112]: Precisor
            - text: →
        - generic [ref=f14e113]:
          - paragraph [ref=f14e114]: IF THE NUMBER OF PROJECTED LASER LINES GROWS
          - heading "SHUTTLE PRECISOR" [level=3] [ref=f14e115]
          - paragraph [ref=f14e116]: If more than six lines must be visible at once, the shuttle architecture — a single servo axis positioning multiple laser carriages — takes over. The decision is based on the densest recipe in your portfolio.
          - link "Explore Shuttle Precisor →" [ref=f14e117] [cursor=pointer]:
            - /url: http://localhost/servo/en/shuttle-precisor/
            - text: Explore Shuttle
            - generic [ref=f14e118]: Precisor
            - text: →
      - generic [ref=f14e119]:
        - paragraph [ref=f14e120]: EXAMPLE INSTALLATION
        - paragraph [ref=f14e121]: CORE PRECISOR · K4 DUAL CHANNEL · 1,600 MM TRAVEL
        - paragraph [ref=f14e122]: Two independent motion channels plus a fixed centre reference on a separate bracket. In symmetrical layup, both edges are positioned simultaneously while the centre line stays visible throughout production. These figures come from one example installation; the dimensions for your line are determined during the site survey.
