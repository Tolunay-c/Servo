        - heading [level=1] [ref=f14e28]:
          - text: EDGE AND SYMMETRY REFERENCE
          - emphasis [ref=f14e29]: IN REINFORCEMENT LAYUP
        - paragraph [ref=f14e30]: Reinforcement ply layup width changes from product to product. Every changeover means re-establishing the edge position and the symmetry axis, and setting them by eye makes the result depend on the operator and on the time available. ServoMotion reads the target positions from the recipe and projects the laser reference lines onto the working surface.
